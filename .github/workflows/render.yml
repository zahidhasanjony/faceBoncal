name: Render EduTalk Bone Health (Bangla)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'public/script.srt'
      - 'public/voiceover.mp3'
      - 'public/sfx/**'
      - 'scripts/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'remotion.config.ts'
      - '.github/workflows/render.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout complete project
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install video dependencies
        run: npm install --no-audit --no-fund
      - name: Download Hind Siliguri weights and license
        run: npm run fonts
      - name: Rebuild scene timings from original SRT
        run: npm run timeline
      - name: Type-check Remotion components
        run: npm run typecheck
      - name: Check font files are present
        run: |
          test -s public/fonts/HindSiliguri-Regular.ttf
          test -s public/fonts/HindSiliguri-SemiBold.ttf
          test -s public/fonts/HindSiliguri-Bold.ttf
      - name: Render sample stills with actual Bangla font
        run: |
          mkdir -p out/stills dist
          npx remotion still src/index.ts Main out/stills/01-hook.png --frame=140 --overwrite
          npx remotion still src/index.ts Main out/stills/02-construction.png --frame=1540 --overwrite
          npx remotion still src/index.ts Main out/stills/03-vitamin-d.png --frame=6590 --overwrite
          npx remotion still src/index.ts Main out/stills/04-ending.png --frame=7590 --overwrite
      - name: Render narrated H264 MP4, 1080x1920 at 60fps
        run: npm run render
      - name: Check encoded video streams
        run: |
          ffprobe -v error -show_entries stream=codec_name,codec_type,width,height,r_frame_rate -show_entries format=duration -of json dist/EduTalk_BoneHealth_1080x1920.mp4
      - name: Upload MP4 and verification stills
        uses: actions/upload-artifact@v4
        with:
          name: EduTalk_BoneHealth_1080x1920_60fps_Bangla
          path: |
            dist/EduTalk_BoneHealth_1080x1920.mp4
            out/stills/*.png
          if-no-files-found: error
          retention-days: 30
